<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155c45"><title>Dobar dan · 克罗地亚语复习</title><style>
:root{--g:#155c45;--ink:#17251f;--mut:#65776c;--line:#d9e4dc;--paper:#f6f8f6;--gold:#f7e7a9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:700px;margin:auto;padding:22px 16px 48px}header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.brand{font-weight:800;color:var(--g);font-size:15px}.brand span{display:inline-grid;place-items:center;background:var(--g);color:var(--gold);width:30px;height:30px;border-radius:10px;margin-right:8px}h1{font-size:26px;margin:8px 0 0;letter-spacing:-.5px}.pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;color:var(--mut)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 4px 14px #1649260a}.stat{padding:12px}.label{color:var(--mut);font-size:12px}.value{font-weight:800;font-size:18px;margin-top:2px}.tabs{display:flex;gap:8px;margin:16px 0;overflow:auto;padding-bottom:2px}.tab,button{border:0;font:inherit;cursor:pointer}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:12px;font-size:14px}.tab.active,button.primary{background:var(--g);color:#fff;border-color:var(--g)}.card{overflow:hidden}.course-head{padding:18px;border-bottom:1px solid var(--line);background:#fcfdfc}.course-head h2{font-size:18px;margin:0}.course-head p{margin:4px 0 0;color:var(--mut);font-size:14px}.item{padding:16px 18px;border-bottom:1px solid #edf2ee}.item:last-child{border:0}.num{color:#83a18f;font-size:13px;font-weight:800}.hr{font-size:17px;font-weight:800;margin-top:2px}.zh{color:var(--mut);font-weight:400;font-size:15px}.ex{font-style:italic;color:#254a39;margin:6px 0 0}.tr{color:var(--mut);font-size:14px}.note{color:#89651b;font-size:12px;margin-top:5px}.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px;background:#fcfdfc}.hint{color:var(--mut);font-size:12px}.primary{padding:11px 15px;border-radius:12px;font-weight:750}.secondary{padding:10px 13px;border-radius:12px;background:#e9f1ed;color:var(--g);font-weight:750}.history{padding:12px}.history button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin:5px 0}.history button:disabled{opacity:.55}.done{color:var(--g);float:right;font-weight:800}.review{padding:18px}.review li{margin:10px 0}.empty{padding:30px 18px;color:var(--mut);text-align:center}@media(min-width:640px){main{padding-top:38px}.stats{grid-template-columns:repeat(4,1fr)}}
 .review h3{margin:22px 0 8px}.review-list{display:grid;gap:8px}.review-card{border:1px solid var(--line);border-radius:12px;padding:12px}.review-card .prompt{font-weight:750}.review-card button{margin-top:8px}.review-card .answer{margin-top:8px;color:var(--g);font-weight:800}
</style></head><body><main><header><div><div class="brand"><span>Ć</span>Dobar dan</div><h1>克罗地亚语 · 日常复习</h1></div><div class="pill">每课 10–15 分钟</div></header><section class="stats" id="stats"></section><nav class="tabs"><button class="tab active" data-view="today">继续学习</button><button class="tab" data-view="history">历史课程</button><button class="tab" data-view="review">中文复习</button></nav><section id="app"></section></main><script>
const lessons=[
 {t:'认识与礼貌',items:[['dobar dan','你好；日安','Dobar dan, kako ste?','你好，您好吗？'],['bok','嗨；再见（非正式）','Bok, vidimo se sutra!','嗨，明天见！'],['hvala','谢谢','Hvala ti na pomoći.','谢谢你的帮助。'],['molim','请；不客气','Jednu kavu, molim.','请来一杯咖啡。','点单时很常用。'],['oprosti','对不起；不好意思','Oprosti, kasnim pet minuta.','不好意思，我晚了五分钟。'],['ne razumijem','我不明白','Oprosti, ne razumijem.','抱歉，我不明白。'],['možete li ponoviti?','您能重复一遍吗？','Možete li ponoviti, molim?','您能重复一遍吗？'],['govorite li engleski?','您说英语吗？','Govorite li engleski?','您说英语吗？'],['kako se zovete?','您叫什么名字？','Kako se zovete? Ja sam Lina.','您叫什么名字？我叫丽娜。'],['drago mi je','很高兴认识你','Drago mi je što smo se upoznali.','很高兴认识你。']]},
 {t:'时间与约见',items:[['danas','今天','Danas radim od kuće.','我今天在家工作。'],['sutra','明天','Sutra imam slobodan dan.','我明天休息。'],['sada','现在','Sada nemam vremena.','我现在没时间。'],['kasnije','晚些时候','Nazvat ću te kasnije.','我晚些时候给你打电话。'],['ujutro','早上','Ujutro pijem čaj.','我早上喝茶。'],['navečer','晚上','Navečer čitam knjigu.','我晚上看书。'],['imam vremena','我有时间','Danas popodne imam vremena.','我今天下午有时间。'],['nemam vremena','我没时间','Oprosti, sada nemam vremena.','抱歉，我现在没时间。'],['možemo li se naći?','我们能见面吗？','Možemo li se naći nakon posla?','我们下班后能见面吗？'],['u koliko sati?','几点？','U koliko sati počinje film?','电影几点开始？']]},
 {t:'日常需求',items:[['želim','我想要','Želim čašu vode.','我想要一杯水。'],['trebam','我需要','Trebam malo odmora.','我需要休息一下。'],['mogu','我能；可以','Mogu platiti karticom?','我可以用卡付款吗？'],['ne mogu','我不能；不可以','Danas ne mogu doći.','我今天不能来。'],['gdje je...?','……在哪里？','Gdje je najbliža trgovina?','最近的商店在哪里？'],['koliko košta?','多少钱？','Koliko košta ova karta?','这张票多少钱？'],['račun, molim','请给我账单','Račun, molim.','请给我账单。'],['bez','不要；没有','Kavu bez šećera, molim.','请给我不加糖的咖啡。'],['s','和；带着','Vodu s ledom, molim.','请给我加冰的水。'],['samo','只；仅仅','Samo gledam, hvala.','我只是看看，谢谢。']]},
 {t:'表达想法',items:[['sviđa mi se','我喜欢；我觉得不错','Sviđa mi se ovaj grad.','我喜欢这座城市。'],['mislim da','我觉得；我认为','Mislim da je to dobra ideja.','我觉得那是个好主意。'],['zapravo','其实；实际上','Zapravo, nisam sigurna.','其实，我不太确定。'],['možda','也许','Možda možemo ići pješice.','也许我们可以走路去。'],['naravno','当然','Naravno, nema problema.','当然，没问题。'],['nije važno','没关系；不重要','Nije važno, razumijem.','没关系，我明白。'],['stvarno?','真的吗？','Stvarno? Nisam to znala.','真的吗？我不知道。'],['baš','很；正好','Baš mi je drago.','我真的很高兴。','口语中很常见。'],['dogovoreno','说定了','Vidimo se u šest? Dogovoreno.','六点见？说定了。'],['vidimo se','回头见','Vidimo se sljedeći tjedan.','下周见。']]}
 ,{t:'饮食与点单',items:[['gladan sam / gladna sam','我饿了','Gladan sam, idemo jesti.','我饿了，我们去吃饭吧。','说话者为女性时用 gladna sam。'],['žedan sam / žedna sam','我渴了','Žedna sam, trebam vodu.','我渴了，需要水。','说话者为男性时用 žedan sam。'],['kava','咖啡','Želim jednu kavu.','我想要一杯咖啡。'],['voda','水','Mogu dobiti vodu?','我能要杯水吗？'],['doručak','早餐','Doručak je u osam.','早餐在八点。'],['ručak','午餐','Idemo na ručak.','我们去吃午饭吧。'],['večera','晚餐','Večera je gotova.','晚饭好了。'],['ukusno','好吃','Ovo je ukusno.','这个很好吃。'],['što preporučujete?','您推荐什么？','Što preporučujete danas?','您今天推荐什么？'],['još nešto?','还要别的吗？','Još nešto? Ne, hvala.','还要别的吗？不用，谢谢。']]}
 ,{t:'出门与方向',items:[['lijevo','左边','Skrenite lijevo.','请左转。'],['desno','右边','Skrenite desno.','请右转。'],['ravno','直走','Idite ravno.','请直走。'],['blizu','近','Stanica je blizu.','车站很近。'],['daleko','远','Je li centar daleko?','市中心远吗？'],['stanica','车站','Gdje je autobusna stanica?','公交车站在哪里？'],['autobus','公交车','Autobus stiže uskoro.','公交车很快到。'],['karta','车票','Trebam jednu kartu.','我需要一张票。'],['ovdje','这里','Čekam te ovdje.','我在这里等你。'],['tamo','那里','Trgovina je tamo.','商店在那里。']]}
 ,{t:'购物与付款',items:[['trgovina','商店','Trgovina je otvorena.','商店开着。'],['otvoreno','营业中；开着','Je li danas otvoreno?','今天营业吗？'],['zatvoreno','关门了','Danas je zatvoreno.','今天关门了。'],['veličina','尺码','Imate li moju veličinu?','有我的尺码吗？'],['mogu li probati?','我可以试试吗？','Mogu li probati ovu jaknu?','我可以试穿这件夹克吗？'],['preskupo je','太贵了','Ovo je preskupo za mene.','这对我来说太贵了。'],['jeftinije','更便宜','Imate li nešto jeftinije?','有更便宜的吗？'],['platiti','付款','Mogu platiti ovdje?','我可以在这里付款吗？'],['gotovina','现金','Plaćam gotovinom.','我用现金付款。'],['kartica','银行卡','Plaćam karticom.','我刷卡付款。']]}
 ,{t:'近况与约定',items:[['kako si?','你好吗？','Bok, kako si?','嗨，你好吗？'],['dobro sam','我很好','Dobro sam, hvala.','我很好，谢谢。'],['umoran sam / umorna sam','我累了','Umorna sam danas.','我今天累了。','说话者为男性时用 umoran sam。'],['zauzet sam / zauzeta sam','我很忙','Zauzeta sam ovaj tjedan.','我这周很忙。','说话者为男性时用 zauzet sam。'],['slobodan sam / slobodna sam','我有空','Slobodna sam u subotu.','我周六有空。','说话者为男性时用 slobodan sam。'],['što radiš?','你在做什么？','Što radiš večeras?','你今晚做什么？'],['nazvat ću te','我会打电话给你','Nazvat ću te sutra.','我明天给你打电话。'],['pošalji mi poruku','给我发消息','Pošalji mi poruku kasnije.','晚些时候给我发消息。'],['odgovara mi','我方便；我可以','Petak mi odgovara.','周五我可以。'],['jedva čekam','我很期待','Jedva čekam vikend.','我很期待周末。']]}
];
const KEY='croatian-review-mobile-v1';
const seeded={current:4,done:{1:'2026-09-22T00:00:00.000Z'},view:'today'};
let s;
try{s=JSON.parse(localStorage.getItem(KEY)||'null')||seeded}catch{s=seeded}
s.done=s.done||{};
// The learner confirmed in chat that all four first-week lessons are complete.
if(!s.week1Confirmed){for(let n=1;n<=4;n++)s.done[n]=s.done[n]||'2026-10-11T00:00:00+08:00';s.current=4;s.week1Confirmed=true}
s.current=Math.max(1,Math.min(Number(s.current)||4,lessons.length));
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function unlock(){
 const n=s.current,now=new Date(),finished=s.done[n]&&new Date(s.done[n]);
 if(n>=lessons.length||!finished||isNaN(finished)||localDate(now)<=localDate(finished)||now.getHours()<7)return;
 const weekday=now.getDay();
 if(n%4===0?weekday===1:weekday>=1&&weekday<=4){s.current=n+1;save()}
}
save();unlock();
function stats(){const week=Math.ceil(s.current/4),first=(week-1)*4+1,complete=[0,1,2,3].filter(i=>s.done[first+i]).length;document.querySelector('#stats').innerHTML=[['Current Week','Week '+week],['Current Lesson','Lesson '+s.current],['今日状态',s.done[s.current]?'Completed':'In Progress'],['Weekly Progress',complete+' / 4']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function item(x,i){return `<article class="item"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="hr">${x[0]} <span class="zh">${x[1]}</span></div><div class="ex">${x[2]}</div><div class="tr">${x[3]}</div>${x[4]?`<div class="note">提示：${x[4]}</div>`:''}</article>`}
function today(){unlock();stats();let n=s.current,l=lessons[n-1],done=!!s.done[n];document.querySelector('#app').innerHTML=`<section class="card"><div class="course-head"><h2>Week ${Math.ceil(n/4)} · Lesson ${((n-1)%4)+1} · ${l.t}</h2><p>${done?(n===lessons.length?'本组四课已完成。可以去中文复习区练习。':n%4===0?'本组四课已完成。下一组从之后的周一早上 7 点起开放。':'已完成。下一课将在之后的学习日早上 7 点起开放。'):'10 个日常表达，按自己的时间学习。'}</p></div>${l.items.map(item).join('')}<div class="foot">${done?'<span class="hint">✓ 已完成</span>':'<span class="hint">10 个项目 · 约 10–15 分钟</span>'}${done?'':`<button class="primary" onclick="complete()">Mark as Completed</button>`}</div></section>`}
function complete(){if(s.done[s.current])return;s.done[s.current]=new Date().toISOString();save();today()}
function history(){document.querySelector('#app').innerHTML=`<section class="card history"><div class="course-head"><h2>历史课程</h2><p>随时回看已开放的课程，不会影响当前进度。</p></div>${lessons.map((l,i)=>`<button ${i+1>s.current?'disabled':'onclick="show('+(i+1)+')"'}>Week ${Math.ceil((i+1)/4)} · Lesson ${(i%4)+1} · ${l.t}${s.done[i+1]?'<span class="done">已完成</span>':i+1>s.current?'<span class="done">未解锁</span>':''}</button>`).join('')}</section>`}
function show(n){let l=lessons[n-1];document.querySelector('#app').innerHTML=`<section class="card"><div class="course-head"><h2>Lesson ${n} · ${l.t}</h2><p>历史复习</p></div>${l.items.map(item).join('')}</section>`}
function reveal(button,lessonIndex,itemIndex){const answer=lessons[lessonIndex].items[itemIndex][0];button.insertAdjacentHTML('afterend',`<div class="answer">${answer}</div>`);button.remove()}
function review(){
 const groups=lessons.map((lesson,i)=>({lesson,i})).filter(({i})=>s.done[i+1]);
 document.querySelector('#app').innerHTML=`<section class="card review"><h2>中文 → 克罗地亚语</h2><p class="hint">先看中文，自己说出克罗地亚语；需要核对时再点“显示答案”。已完成的四节课，共 40 项，全部在下面。</p>${groups.map(({lesson,i})=>`<h3>Week ${Math.ceil((i+1)/4)} · Lesson ${(i%4)+1} · ${lesson.t}</h3><div class="review-list">${lesson.items.map((x,j)=>`<div class="review-card"><div class="prompt">${j+1}. ${x[1]}</div><button class="secondary" onclick="reveal(this,${i},${j})">显示答案</button></div>`).join('')}</div>`).join('')}</section>`
}
function render(){unlock();stats();(({today,history,review})[s.view]||today)()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');s.view=b.dataset.view;save();render()});
if(!['today','history','review'].includes(s.view))s.view='today';
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
setInterval(()=>{const previous=s.current;unlock();if(s.current!==previous)render()},60000);
render();
</script></body></html>
